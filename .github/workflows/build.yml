name: Build IosNoti .deb

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git perl fakeroot dpkg-dev
          export THEOS=/opt/theos
          sudo git clone --recursive https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install iOS SDK (theos/sdks)
        run: |
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set --no-cone iPhoneOS15.5.sdk
          git checkout
          sudo mkdir -p "$THEOS/sdks"
          sudo mv iPhoneOS15.5.sdk "$THEOS/sdks/"

      - name: Install ldid
        run: |
          sudo curl -L -o /usr/local/bin/ldid \
            https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          sudo chmod +x /usr/local/bin/ldid

      - name: Build package
        run: |
          export THEOS=/opt/theos
          export THEOS_DEVICE_IP=
          make clean package FINALPACKAGE=1 \
            TARGET=iphone:clang:15.5:15.0

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: IosNoti-deb
          path: packages/*.deb
          if-no-files-found: error
