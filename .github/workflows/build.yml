name: Build IosNoti .deb

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl git perl fakeroot dpkg-dev rsync \
            build-essential pkg-config libxml2-dev
          export THEOS=/opt/theos
          sudo git clone --recursive https://github.com/theos/theos.git "$THEOS"
          sudo chown -R "$(whoami)" "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Install iOS SDK (theos/sdks)
        run: |
          set -euo pipefail
          SDK_NAME="iPhoneOS15.6.sdk"
          git clone -n --depth=1 --filter=tree:0 --branch master \
            https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set --no-cone "$SDK_NAME"
          git checkout master
          test -d "$SDK_NAME" || { echo "SDK $SDK_NAME not found after checkout"; ls; exit 1; }
          sudo mkdir -p "$THEOS/sdks"
          sudo mv "$SDK_NAME" "$THEOS/sdks/"
          # Theos resolve TARGET=...:latest:... bằng cách tìm SDK mới nhất trong
          # $THEOS/sdks theo tên; không cần symlink thêm, nhưng ta ép rõ version
          # ở bước build để không phụ thuộc "latest" tính sai.
          ls "$THEOS/sdks"

      - name: Install ldid
        run: |
          sudo curl -L -o /usr/local/bin/ldid \
            https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          sudo chmod +x /usr/local/bin/ldid

      - name: Build package
        run: |
          set -euo pipefail
          echo "THEOS=$THEOS"
          ls -la "$THEOS/sdks"
          export THEOS_DEVICE_IP=
          # TARGET dùng "latest" không resolve được vì SDK được copy tay (không
          # qua installer chính thức) -> ép rõ version SDK khớp với bước cài trên.
          make clean package FINALPACKAGE=1 \
            TARGET=iphone:clang:15.6:15.0 2>&1

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: IosNoti-deb
          path: packages/*.deb
          if-no-files-found: error
